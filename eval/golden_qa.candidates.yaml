# Candidate entries for eval/golden_qa.yaml (TODO.md Path 1.5).
#
# NOT valid input for eval_golden.py as-is, and must never be renamed
# straight to golden_qa.yaml. Every expected_source/expected_page below came
# from running the *current* retrieval system against itself (query top-1 on
# the indexed text_corpus collection, 2026-09-16) - it proves what the index
# currently returns, not what the books actually say. eval_golden.py's own
# docstring is explicit that fabricated or retrieval-derived expected values
# make the recall number meaningless, since a broken retriever would just
# grade itself as correct.
#
# How to use this file:
#   1. For each entry, open the named file at the given page (or nearby -
#      pymupdf4llm page numbers are 0-indexed from the PDF, so check +/-1)
#      and confirm it actually answers the question.
#   2. If it does: copy the entry into eval/golden_qa.yaml as-is (or fix
#      expected_page if the real answer is a page or two off).
#   3. If it doesn't: either find the real page yourself and use that, or
#      drop the question.
#   4. Entries flagged SUSPICIOUS below are near-certain misses - the
#      retriever returned the only indexed clanbook with a text layer
#      (Gangrel) for clans whose actual books are still unindexed scans
#      (Path 3). Keep only if you want a known-miss regression case, marked
#      as such; otherwise discard.
#
# Only 24 candidates here, covering VTM clan/discipline basics and Eberron
# geography/lore - the golden set target is 30-50, so eval/golden_qa.yaml
# will still need more once these are verified.


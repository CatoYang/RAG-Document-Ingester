# ==============================================================================
# RAG Document Ingester Configuration
# ==============================================================================
# This file controls the behavior of the entire ingestion pipeline.

pipeline:
  mode: "extract_and_clean"  # Options: "extract_only", "clean_only", "extract_and_clean"
  targets:
    - "data/Across Eberron"
  output_dir: "data/staging_markdown"

# Global fallback cleanup rules
cleanup_rules:
  collapse_newlines: true
  remove_zero_width_spaces: true
  trim_trailing_whitespace: true
  regex_removals:
    - 'əʊ'
    - '(?m)^Page \d+$'
    - '(?m)^```markdown\s*$'
    - '(?m)^```\s*$'
    - '(?m)^<!-- PAGE \d+ -->\s*$'
    - '(?im)^\s*[\(\*_]*Note:.*$'
    - '(?im)^(?:\s*-\s*|\s*[\(\*_]*Note:[\(\*_]*\s*)?The image (?:contains|shows|appears|provided|includes|also).*$'
    - '(?im)^.*If you have another image containing text.*$'
    - '(?im)^.*This output captures the exact text.*$'
    - '(?im)^.*In case you can''t read any text.*$'
    - '(?m)^.*©\d{4}.*Wizards of the Coast.*$'
    - '(?m)^.*Manufactured by Hasbro.*$'
    - '(?m)^.*DUNGEONS & DRAGONS, D&D, Wizards of the Coast.*$'

# ----------------------------------------------------------------------------
# File Format Rules
# ----------------------------------------------------------------------------
file_rules:
  # ============================================================================
  # PDF Documents
  # ============================================================================
  .pdf:
    extractor: "PdfVLMExtractor"
    fallback: "PdfTextExtractor"
    params:
      model: "minicpm-v"
      dpi: 300
      temperature: 0.0
    cleanup_rules:
      collapse_newlines: true
      remove_zero_width_spaces: true
      trim_trailing_whitespace: true
      deduplicate_paragraphs: true
      regex_removals:
        - '(?m)^\s*\d+\s*$'
        - '(?m)^```markdown\s*$'
        - '(?m)^```\s*$'
        - '(?m)^<!-- PAGE \d+ -->\s*$'
        - '(?im)^\s*[\(\*_]*Note:.*$'
        - '(?im)^(?:\s*-\s*|\s*[\(\*_]*Note:[\(\*_]*\s*)?The image (?:contains|shows|appears|provided|includes|also).*$'
        - '(?im)^.*If you have another image containing text.*$'
        - '(?im)^.*This output captures the exact text.*$'
        - '(?im)^.*In case you can''t read any text.*$'
        - '(?m)^.*©\d{4}.*Wizards of the Coast.*$'
        - '(?m)^.*Manufactured by Hasbro.*$'
        - '(?m)^.*DUNGEONS & DRAGONS, D&D, Wizards of the Coast.*$'
  
  # ============================================================================
  # Word Documents
  # ============================================================================
  .docx:
    extractor: "DocxExtractor"
    fallback: "UniversalExtractor"
    params:
      strip_comments: true
    cleanup_rules:
      collapse_newlines: true
      remove_zero_width_spaces: true
      trim_trailing_whitespace: true
  
  # ============================================================================
  # Spreadsheets
  # ============================================================================
  .xlsx:
    extractor: "SpreadsheetExtractor"
    fallback: "UniversalExtractor"
    params:
      skip_empty_sheets: true
    cleanup_rules:
      collapse_newlines: true
      remove_zero_width_spaces: true
      trim_trailing_whitespace: true
  
  .csv:
    extractor: "SpreadsheetExtractor"
    fallback: "UniversalExtractor"
    params:
      skip_empty_sheets: true
    cleanup_rules:
      collapse_newlines: true
      remove_zero_width_spaces: true
      trim_trailing_whitespace: true
      
  # ============================================================================
  # Web & Structured Data
  # ============================================================================
  .html:
    extractor: "HtmlExtractor"
    fallback: "UniversalExtractor"
    params:
      strict_content: true
    cleanup_rules:
      collapse_newlines: true
      remove_zero_width_spaces: true
      trim_trailing_whitespace: true
    
  # ============================================================================
  # Presentations
  # ============================================================================
  .pptx:
    extractor: "PresentationExtractor"
    fallback: "UniversalExtractor"
    params: {}
    cleanup_rules:
      collapse_newlines: true
      remove_zero_width_spaces: true
      trim_trailing_whitespace: true
    
  # ============================================================================
  # Archives & Emails
  # ============================================================================
  .zip:
    extractor: "ArchiveUnpacker"
    
  .eml:
    extractor: "ArchiveUnpacker"

  # ============================================================================
  # Plain Text & Markdown
  # ============================================================================
  .txt:
    extractor: "MarkItDownExtractor"
    
  .md:
    extractor: "MarkItDownExtractor"

  # ============================================================================
  # eBooks
  # ============================================================================
  .epub:
    extractor: "EpubExtractor"

  # ============================================================================
  # Images (Vision Model Extraction)
  # ============================================================================
  .png:
    extractor: "ImageVLMExtractor"
    params:
      model: "qwen2.5-vl"
      dpi: 200
      temperature: 0.0
    cleanup_rules:
      deduplicate_paragraphs: true
  .jpg:
    extractor: "ImageVLMExtractor"
    params:
      model: "qwen2.5-vl"
      dpi: 200
      temperature: 0.0
    cleanup_rules:
      deduplicate_paragraphs: true
  .jpeg:
    extractor: "ImageVLMExtractor"
    params:
      model: "qwen2.5-vl"
      dpi: 200
      temperature: 0.0
    cleanup_rules:
      deduplicate_paragraphs: true

  # ============================================================================
  # Open Office Formats
  # ============================================================================
  .odt:
    extractor: "OpenOfficeExtractor"
  .ods:
    extractor: "OpenOfficeExtractor"
  .odp:
    extractor: "OpenOfficeExtractor"

# ============================================================================
# Phase 2: Indexing Pipeline
# ============================================================================
indexing:
  chunker:
    type: "MarkdownChunker"
    params:
      chunk_size: 1000
      chunk_overlap: 200
  embedder:
    type: "OllamaEmbedder"
    params:
      model: "nomic-embed-text"
  vectorstore:
    type: "ChromaDBStore" # Options: ChromaDBStore, QdrantStore
    params:
      persist_directory: "data/chromadb"
      collection_name: "across_eberron"

# ==============================================================================
# MASTER PIPELINE CONFIGURATION TEMPLATE
# ==============================================================================
# This template contains all possible configuration options and their default/
# expected structures. Use this as a reference when building custom configs.
# 
# DO NOT MODIFY THIS FILE DIRECTLY. It is auto-generated.
# ==============================================================================

pipeline:
  mode: extract_and_clean
  targets:
  - data/raw
  output_dir: data/staging/staging_markdown
  dynamic_cleaner:
    enabled: true
    provider: ollama
    params:
      model: llama3
cleanup_rules:
  collapse_newlines: true
  remove_zero_width_spaces: true
  trim_trailing_whitespace: true
  deduplicate_paragraphs: false
  regex_removals: []
file_rules:
  .pdf:
    extractor: PdfVLMExtractor
    fallback: PdfTextExtractor
    params:
      model: minicpm-v
      dpi: 300
      temperature: 0.0
    cleanup_rules:
      collapse_newlines: true
      remove_zero_width_spaces: true
      trim_trailing_whitespace: true
      deduplicate_paragraphs: true
      regex_removals:
      - (?m)^```markdown\s*$
      - (?m)^```\s*$
  .docx:
    extractor: DocxExtractor
    fallback: UniversalExtractor
    params:
      strip_comments: true
    cleanup_rules:
      collapse_newlines: true
      remove_zero_width_spaces: true
      trim_trailing_whitespace: true
      deduplicate_paragraphs: false
      regex_removals: []
  .xlsx:
    extractor: SpreadsheetExtractor
    fallback: UniversalExtractor
    params:
      skip_empty_sheets: true
    cleanup_rules:
      collapse_newlines: true
      remove_zero_width_spaces: true
      trim_trailing_whitespace: true
      deduplicate_paragraphs: false
      regex_removals: []
  .html:
    extractor: HtmlExtractor
    fallback: UniversalExtractor
    params:
      strict_content: true
    cleanup_rules:
      collapse_newlines: true
      remove_zero_width_spaces: true
      trim_trailing_whitespace: true
      deduplicate_paragraphs: false
      regex_removals: []
  .txt:
    extractor: MarkItDownExtractor
    params: {}
  .png:
    extractor: ImageVLMExtractor
    params:
      model: qwen2.5-vl
      dpi: 200
      temperature: 0.0
    cleanup_rules:
      collapse_newlines: true
      remove_zero_width_spaces: true
      trim_trailing_whitespace: true
      deduplicate_paragraphs: true
      regex_removals: []
summarisation:
  enabled: false
  provider: ollama
  params: {}
indexing:
  chunker:
    type: MarkdownChunker
    params: {}
  embedder:
    type: OllamaEmbedder
    params: {}
  vectorstore:
    type: ChromaDBStore
    params: {}
